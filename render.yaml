# Free plan: no persistent disk. The uploaded sheet lives in the container's
# ephemeral filesystem, so it must be re-uploaded after a restart or deploy.
# To keep the sheet across restarts, switch to `plan: starter` and uncomment
# the disk block below (~$7/mo + $0.25/GB).
services:
  - type: web
    name: gem-miner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      # Optional: Google Sheet link (.../spreadsheets/d/<id>/edit?usp=sharing),
      # shared with "anyone with the link". Every run re-downloads it, which also
      # works around the missing disk on the free plan.
      - key: WALLETS_SHEET_URL
        sync: false
    # disk:
    #   name: gem-miner-data
    #   mountPath: /app/data
    #   sizeGB: 1
